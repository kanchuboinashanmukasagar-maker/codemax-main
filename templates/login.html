<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeDaily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem("codedaily-theme") || "dark";
        document.documentElement.dataset.theme = savedTheme;
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>

    <button type="button" class="theme-toggle-btn auth-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-toggle-indicator" aria-hidden="true">
            <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </span>
        <span class="theme-toggle-label js-theme-label">Dark</span>
    </button>

    <section class="auth-card">
        <div class="auth-header">
            <span class="brand-mark">&lt;/&gt;</span>
            <h1>Welcome back</h1>
            <p>Log in to continue your daily coding streak.</p>
        </div>
        <form method="POST" class="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="coder@example.com" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            
            <button type="submit">Sign In</button>
        </form>
        {% if message %}<p class="form-message">{{ message }}</p>{% endif %}
        <p class="auth-switch">New to CodeDaily? <a href="{{ url_for('register') }}">Create an account</a></p>
    </section>

    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
