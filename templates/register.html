<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CodeDaily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem("codedaily-theme") || "dark";
        document.documentElement.dataset.theme = savedTheme;
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
    <!-- Interactive Moving Particle Background -->
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>

    <section class="auth-card">
        <div class="auth-header">
            <span class="brand-mark">&lt;/&gt;</span>
            <h1>Create Account</h1>
            <p>Start solving one focused coding challenge every day.</p>
        </div>
        <form method="POST" class="auth-form">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name" placeholder="Alex Rivers" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="alex@example.com" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
            
            <button type="submit">Create Account</button>
        </form>
        {% if message %}<p class="form-message">{{ message }}</p>{% endif %}
        <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </section>

    <!-- Particle and Interaction Scripts -->
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
